apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: aurapan
build:
  # Local build for Docker Desktop Kubernetes (images are not pushed)
  local:
    push: false
    concurrency: 3
  artifacts:
    - image: thasup/user
      context: user
      docker:
        dockerfile: dev.Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: thasup/product
      context: product
      docker:
        dockerfile: dev.Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: thasup/order
      context: order
      docker:
        dockerfile: dev.Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: thasup/payment
      context: payment
      docker:
        dockerfile: dev.Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: thasup/expiration
      context: expiration
      docker:
        dockerfile: dev.Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: thasup/client
      context: client
      docker:
        dockerfile: dev.Dockerfile
      sync:
        manual:
          - src: "app/**/*"
            dest: .
          - src: "components/**/*"
            dest: .
          - src: "hooks/**/*"
            dest: .
          - src: "lib/**/*"
            dest: .
          - src: "styles/**/*"
            dest: .
          - src: "public/**/*"
            dest: .
manifests:
  rawYaml:
    - ./infra/k8s/*
    - ./infra/k8s-local-db/*
    - ./infra/k8s-dev/*
deploy:
  kubectl: {}
