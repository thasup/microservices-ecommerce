apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: thasup/client
          env:
            # In-cluster URL used by the Next.js server for server-side API calls.
            - name: API_URL
              value: "http://ingress-nginx-controller.ingress-nginx.svc.cluster.local"
            # Optional public keys; create the `client-secret` Secret to enable them.
            - name: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: client-secret
                  key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
                  optional: true
            - name: NEXT_PUBLIC_PAYPAL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: client-secret
                  key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
                  optional: true
            - name: NEXT_PUBLIC_GA_ID
              valueFrom:
                secretKeyRef:
                  name: client-secret
                  key: NEXT_PUBLIC_GA_ID
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: client-srv
spec:
  selector:
    app: client
  type: ClusterIP
  ports:
    - name: client
      protocol: TCP
      port: 3000
      targetPort: 3000
